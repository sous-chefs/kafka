---
provisioner:
  name: chef_infra
  chef_license: accept
  deprecations_as_errors: true
  policyfile: Policyfile.rb
  attributes:
    kafka_test:
      version: <%= ENV.fetch('KAFKA_VERSION', '4.2.1').inspect %>
      scala_version: <%= ENV.fetch('SCALA_VERSION', '2.13').inspect %>
      sha512_checksum: <%= ENV.fetch('KAFKA_SHA512', 'f643e31266268e920aa98ead9a061026c98dac2886932ad468565ba59bcb7fb4f98a4c4f62727367e1bd87515f3b016e6f6ccccad8b12bdef8b091b0fb577170').inspect %>

verifier:
  name: inspec
  sudo: true

platforms:
  - name: almalinux-9
  - name: almalinux-10
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: centos-stream-10
  - name: debian-12
  - name: debian-13
  - name: fedora-latest
  - name: oraclelinux-9
  - name: oraclelinux-10
  - name: rockylinux-9
  - name: rockylinux-10
  - name: ubuntu-22.04
  - name: ubuntu-24.04

x-verifiers:
  default: &default_verifier
    inspec_tests:
      - path: test/integration/default

suites:
  - name: default
    provisioner:
      named_run_list: default
    verifier: *default_verifier
